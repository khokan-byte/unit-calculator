<script>
const $ = id => document.getElementById(id);

/* ---------- Tariff (update here when BERC changes it) ---------- */
const DEMAND = 42;
const LIFELINE = 4.63;
const SLABS = [[75, 5.26], [200, 8.5], [300, 9.1], [400, 9.62], [600, 15.01], [Infinity, 17.35]];
function energy(u) {
  if (u <= 0) return 0;
  if (u <= 50) return u * LIFELINE;
  let prev = 0, tot = 0;
  for (const [cap, r] of SLABS) {
    const n = Math.min(u, cap) - prev;
    if (n > 0) tot += n * r;
    prev = cap;
    if (u <= cap) break;
  }
  return tot;
}
function slabRows(u) {
  const rows = [];
  if (u <= 0) return rows;
  if (u <= 50) return [['1-50', u, LIFELINE]];
  let prev = 0;
  for (const [cap, r] of SLABS) {
    const n = Math.min(u, cap) - prev;
    if (n > 0) rows.push([(prev + 1) + (cap === Infinity ? '+' : '-' + cap), n, r]);
    prev = cap;
    if (u <= cap) break;
  }
  return rows;
}

$('luse').onclick = () => { S.load = +$('luse').dataset.kw; $('s-load').value = S.load; refresh(); };
function renderCompare(t) {
  const el = $('cres'), a = num($('s-act').value);

  const diff = (t.units - a) / a * 100, near = Math.abs(diff) <= 20;
  const pill = '<span class="pill ' + (near ? 'ok' : 'warn') + '">' + (diff >= 0 ? '+' : '−') + pct(Math.abs(diff)) + '</span>';
  el.innerHTML = tr('c_res', fmt(t.units), fmt(a), pill) + '<br>' + (near ? tr('c_close') : diff > 0 ? tr('c_more') : tr('c_less'));

}
function renderSaves(t, b) {
  const box = $('saves'), out = [];
  items.forEach(it => {

    const st = b.total - billFor(Math.max(0, t.units - su)).total;
    out.push('<div class="save">' + tr('s_row', esc(nameOf(it)), esc(alt[lang]), fmt(su), tk(st)) + '</div>');
  });

  box.innerHTML = out.join('');
}

['days', 'load', 'rent', 'vat'].forEach(k => {

$('s-act').addEventListener('input', () => { S.actual = $('s-act').value; refresh(); });

};
$('share').onclick = async () => {

  try {

};

loadState();
$('s-days').value = S.days; $('s-load').value = S.load; $('s-rent').value = S.rent; $('s-vat').value = S.vat; $('s-act').value = S.actual || '';
